name: Staging Deploy

# Deploys the Supabase backend (migrations + edge functions) to the shared
# dev/staging project on every push to `staging`. See STAGING.md for why
# staging currently shares the dev project rather than being fully
# isolated, and DEPLOYMENT.md for where this sits in the branch pipeline
# (feature/* -> develop -> staging -> main -> production).
on:
  push:
    branches:
      - staging
    paths:
      - 'supabase/**'
      - '.github/workflows/staging-deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Push database migrations
        run: supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      # Deploys every function under supabase/functions/. Each function's
      # JWT verification setting comes from supabase/config.toml
      # ([functions.<name>] verify_jwt), not a per-deploy flag, so this one
      # command applies the right setting to each. Provider secrets
      # (ANTHROPIC_API_KEY, STRIPE_SECRET_KEY, etc.) were set once via
      # `supabase secrets set` and persist on the project - no need to
      # re-set them on every deploy, only to redeploy the function code.
      - name: Deploy edge functions
        run: supabase functions deploy
