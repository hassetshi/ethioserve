name: Mobile CI

on:
  # No path filter on pull_request: analyze-and-test is a required status
  # check on main, and a required check that a path filter prevents from
  # ever running blocks merging forever (GitHub can't distinguish
  # "not applicable" from "still pending"). Instead, the job always runs
  # and reports a status, but its steps below skip the actual work when
  # nothing under mobile/ changed.
  pull_request:
  push:
    branches: [develop, staging, main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - '.github/workflows/mobile-ci.yml'

      - uses: subosito/flutter-action@v2
        if: steps.filter.outputs.mobile == 'true'
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Pub get
        if: steps.filter.outputs.mobile == 'true'
        working-directory: mobile
        run: flutter pub get

      # No secrets needed: EnvConfig (mobile/lib/core/config/env_config.dart)
      # falls back to empty strings via String.fromEnvironment when
      # --dart-define isn't passed, so analyze/test/format run against the
      # same source tree a real build would use, without touching Supabase.
      - name: Format check
        if: steps.filter.outputs.mobile == 'true'
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        if: steps.filter.outputs.mobile == 'true'
        working-directory: mobile
        run: flutter analyze

      - name: Unit + widget + integration tests
        if: steps.filter.outputs.mobile == 'true'
        working-directory: mobile
        run: flutter test
