name: Production Backup

# Free alternative to Supabase's paid-plan automatic backups (see
# PRODUCTION.md's "Backups" section) - a daily pg_dump of the production
# database, stored as a private GitHub Actions artifact. Reuses the same
# SUPABASE_PROD_PROJECT_REF / SUPABASE_PROD_DB_PASSWORD secrets
# production-deploy.yml already has (the latter is the real Postgres
# password, not the Supabase CLI access token - see that workflow's
# `supabase db push --password` step).
#
# GitHub disables scheduled workflows on a repo with no activity in 60
# days, and can delay cron runs during high platform load - acceptable
# for a free backup safety net, not a substitute for verifying this
# still ran recently if a restore is ever actually needed.
on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC daily
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # --format=custom: compressed, pg_restore-compatible binary dump
      # (smaller and more flexible to restore selectively than plain SQL).
      - name: Dump production database
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          echo "BACKUP_FILE=ethioserve-production-$TIMESTAMP.dump" >> "$GITHUB_ENV"
          pg_dump \
            --host="db.${{ secrets.SUPABASE_PROD_PROJECT_REF }}.supabase.co" \
            --port=5432 \
            --username=postgres \
            --dbname=postgres \
            --no-owner --no-privileges \
            --format=custom \
            --file="ethioserve-production-$TIMESTAMP.dump"

      # 90 days is the maximum GitHub allows for artifact retention -
      # a longer-lived backup archive would need external storage instead.
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
