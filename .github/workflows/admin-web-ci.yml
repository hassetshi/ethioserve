name: Admin Web CI

on:
  pull_request:
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web-ci.yml'
  push:
    branches: [develop, staging, main]
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web-ci.yml'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin-web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # tsc -b (type-check) + vite build. No VITE_SUPABASE_* secrets are
      # needed here: src/lib/env.ts reads them via import.meta.env and the
      # app already handles them being unset (isSupabaseConfigured), so the
      # bundle still builds without a live project.
      - name: Type-check + build
        run: npm run build
