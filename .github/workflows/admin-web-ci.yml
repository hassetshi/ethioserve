name: Admin Web CI

on:
  # No path filter on pull_request: lint-and-build is a required status
  # check on main, and a required check that a path filter prevents from
  # ever running blocks merging forever (GitHub can't distinguish
  # "not applicable" from "still pending"). Instead, the job always runs
  # and reports a status, but its steps below skip the actual work when
  # nothing under admin-web/ changed.
  pull_request:
  push:
    branches: [develop, staging, main]
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web-ci.yml'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin-web:
              - 'admin-web/**'
              - '.github/workflows/admin-web-ci.yml'

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.admin-web == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin-web/package-lock.json

      - name: Install
        if: steps.filter.outputs.admin-web == 'true'
        working-directory: admin-web
        run: npm ci

      - name: Lint
        if: steps.filter.outputs.admin-web == 'true'
        working-directory: admin-web
        run: npm run lint

      # tsc -b (type-check) + vite build. No VITE_SUPABASE_* secrets are
      # needed here: src/lib/env.ts reads them via import.meta.env and the
      # app already handles them being unset (isSupabaseConfigured), so the
      # bundle still builds without a live project.
      - name: Type-check + build
        if: steps.filter.outputs.admin-web == 'true'
        working-directory: admin-web
        run: npm run build
